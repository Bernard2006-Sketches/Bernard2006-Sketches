<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanafx Forex Academy</title>
  <meta name="google-site-verification" content="txC3ElDpMIkdZcW4o0t4OAHymv5mmR_hxUt8sVFZxBQ" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body{
    margin:0; background:#0E1420; color:#9BA5B5; font-family:'Inter',sans-serif;
    height:100vh; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .spinner{
    width:22px; height:22px; border:2px solid #2A3547; border-top-color:#D9A857;
    border-radius:50%; animation:spin 0.8s linear infinite; margin-right:10px;
  }
  @keyframes spin{ to{transform:rotate(360deg);} }
  .row{display:flex; align-items:center;}
</style>
</head>
<body>
  <div class="row"><div class="spinner"></div>Checking your session…</div>

<script src="supabase-config.js"></script>
<script>
  // This page is the site's true entry point. It never renders real content —
  // it only decides where to send the visitor: straight to login, or into the
  // gated app if they already have a valid Supabase session.

  function showError(msg){
    document.body.innerHTML = `
      <div style="max-width:460px; padding:20px; text-align:center; line-height:1.6;">
        <strong style="color:#e08d7c;">Something went wrong</strong><br><br>
        ${msg}
      </div>`;
  }

  // Safety net: if nothing has resolved within 6 seconds, something is stuck
  // (usually a script that failed to load) — show an error instead of hanging.
  const hangTimer = setTimeout(() => {
    showError(`
      This is taking too long, which usually means a required file didn't load.<br><br>
      If you're opening this file directly on your phone (not through a real
      website address), that's very likely the cause — iOS often blocks local
      HTML files from loading linked scripts like supabase-config.js.<br><br>
      Try deploying to Vercel and testing the live link instead of the local file.
    `);
  }, 6000);

  (async () => {
    try{
      if(typeof window.supabase === 'undefined'){
        clearTimeout(hangTimer);
        showError('The Supabase library failed to load (no internet connection, or the script was blocked). Please check your connection and try again.');
        return;
      }
      if(typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined'){
        clearTimeout(hangTimer);
        showError('supabase-config.js did not load. Make sure all four files (index.html, login.html, app.html, supabase-config.js) are in the same folder.');
        return;
      }
      if(SUPABASE_URL.includes("YOUR_SUPABASE") || SUPABASE_ANON_KEY.includes("YOUR_SUPABASE")){
        clearTimeout(hangTimer);
        showError('Supabase isn\'t configured yet. Open supabase-config.js and add your Project URL and anon key from your Supabase dashboard, then reload.');
        return;
      }

      const { data, error } = await supabaseClient.auth.getSession();
      clearTimeout(hangTimer);

      if(error){
        showError('Could not check your session: ' + error.message);
        return;
      }

      if(data && data.session){
        window.location.replace('app.html');
      } else {
        window.location.replace('login.html');
      }
    } catch(err){
      clearTimeout(hangTimer);
      showError('Unexpected error: ' + err.message);
    }
  })();
</script>
</body>
</html>
